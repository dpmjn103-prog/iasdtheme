<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
	<title id="title">El lugar santísimo</title>
	<desc id="desc">Ilustración editorial del arca del pacto en el lugar santísimo, bañada por una luz dorada.</desc>
	<defs>
		<linearGradient id="chamber" x2="0" y2="1">
			<stop stop-color="#202943"/>
			<stop offset=".7" stop-color="#39334a"/>
			<stop offset="1" stop-color="#574351"/>
		</linearGradient>
		<linearGradient id="veil" x2="1">
			<stop stop-color="#603747"/>
			<stop offset=".5" stop-color="#b36855"/>
			<stop offset="1" stop-color="#66364a"/>
		</linearGradient>
		<linearGradient id="ark" x2="0" y2="1">
			<stop stop-color="#f2d18a"/>
			<stop offset=".45" stop-color="#b98443"/>
			<stop offset="1" stop-color="#704b35"/>
		</linearGradient>
		<radialGradient id="heavenly-light">
			<stop stop-color="#fff0b8" stop-opacity=".85"/>
			<stop offset=".45" stop-color="#f2c56f" stop-opacity=".32"/>
			<stop offset="1" stop-color="#e0a955" stop-opacity="0"/>
		</radialGradient>
		<filter id="soft">
			<feGaussianBlur stdDeviation="18"/>
		</filter>
		<filter id="velvet-texture">
			<feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="11"/>
			<feColorMatrix values="0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .2 0 0 0 .13 0"/>
		</filter>
		<filter id="ark-shadow" x="-.4" y="-.4" width="1.8" height="1.9">
			<feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
			<feOffset dy="11"/>
			<feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer>
			<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>
	<rect width="960" height="600" fill="#e8dcc5"/>
